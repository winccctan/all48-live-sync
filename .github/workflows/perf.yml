# 公演榜 · 公演直播间礼物采集
#
# 为什么单独一条：
#   公演直播间的礼物不进成员房间 IM，口袋48 的公演聊天室拿不到 srv/ch，
#   回放也只有视频没有弹幕 ⇒ **只有开演时盯弹幕流才能记录**，错过就没有。
#   所以这条工作流是「贴着公演时间跑的长任务」：每 10 分钟拨一次，
#   每轮最长 55 分钟；没有公演在播时 20 秒内退出（几乎不花额度，仓库是 public）。
#
# 口径：礼物名/数量/收礼人/单价全部由我们自己按价目表算，不读任何第三方算好的榜。
# 落库：POST {SITE_URL}/api/lv/all（room=3）+ POST {SITE_URL}/api/perf/sessions（场次）
name: 公演榜 · 直播礼物采集

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: '本轮跑多少分钟'
        default: '55'
  schedule:
    # 每 10 分钟一次；公演一般 13:45 / 19:15 开演，长任务自然覆盖整场
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  # 🔴 2026-10-25 换了组名：旧的 `perf-gift` 组里有个僵尸 run（卡在 in_progress 到 65 分钟
  #    timeout 才放），新 dispatch 全被它挡成 pending。换组名让新代码立刻能跑，
  #    同一场的重复记录靠 ingest 的精确键去重。
  group: perf-gift-v2
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    # 🔴 站长 2026-10-25：「同时段可能 10 场公演的」。
    #    48fan 单出口 IP 大约只让开 6 条并发流（第 7 条 429）⇒ 一个 job 盖不住 10 场。
    #    拆 3 片，每片是独立 runner（独立 IP），每片最多 6 场 = 18 个坑位。
    #    分片靠 liveId 的 FNV 哈希（不能取模：末位基本是偶数）。
    # 🔴 站长 2026-10-25 晚：「公演鸡腿必须实时，要作为比赛依据」。
    #    公演礼物没有回放、没有 IM 可补（probe-perf-room 已验），流上丢一条就永久少一分。
    #    ⇒ 每片再派**一个副本**（共 6 个 runner）：同片两个出口 IP 同时听同一批场次，
    #      两路各自落库、按 t|mid|g|num|room 精确去重，一路断流另一路兜住。
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 盯公演弹幕 + 推场次（分片 ${{ matrix.shard }}）
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          RUN_MINUTES: ${{ inputs.run_minutes || '55' }}
          MAX_ROOMS: '6'
          SHARDS: '3'
          REPLICAS: '2'
          FLUSH_MS: '6000'
          SHARD: ${{ matrix.shard }}
        run: node perf-gift-sync.mjs

  # 🔴 官方对账（2026-10-25 站长：「公演鸡腿不允许丢数据」）
  #    公演礼物只有 48fan 弹幕流一个来源，流一断就永久少分。
  #    这里每 25 秒拉一次 live.48.cn 的官方成员鸡腿榜，差多少补多少 ⇒ 榜面永远等于官方。
  #    和上面的采集 job 完全独立：采集挂了它照样对账，对账挂了采集照常跑。
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 官方鸡腿榜对账
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          LV_TOKEN: ${{ secrets.LV_TOKEN }}
          RUN_MINUTES: '55'
          TICK_MS: '15000'
          PERF_PAGE_ANCHOR: ${{ vars.PERF_PAGE_ANCHOR }}
        run: |
          if [ -z "$SITE_URL" ]; then export SITE_URL="https://all48-archive.yqz-tansy.workers.dev"; fi
          if [ -z "$LV_TOKEN" ]; then export LV_TOKEN="$INGEST_TOKEN"; fi
          node perf-hot-sync.mjs
