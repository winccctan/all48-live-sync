# 48 成员档案 · 实时同步
#
# 为什么要有这个仓库：口袋48 的接口按 IP 地域拦（海外出口一律 403），
# 站点自己的 Cloudflare Worker 拉不到实时数据 —— 实测 colo=NRT 时无论带不带 pa 签名都是 403。
# 所以由 GitHub Actions（配国内出口代理 SCRAPE_PROXY）定时抓，再 POST 回站点的 /api/ingest。
#
# 频率：5 分钟一轮。仓库是 public ⇒ Actions 分钟数免费，跑密一点也不会烧额度。
name: 实时同步

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_uids:
        description: '只抓这几个 uid（逗号分隔，留空=按站点关注名单）'
        default: ''

permissions:
  contents: read

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并上报
        run: node sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          FORCE_UIDS: ${{ inputs.force_uids }}
          MAX_FOLLOW: '60'
