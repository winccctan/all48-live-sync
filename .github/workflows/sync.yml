# 48 成员档案 · 实时同步（全员）
#
# 为什么要有这个仓库：口袋48 的接口按 IP 地域拦（海外出口一律 403），
# 站点自己的 Cloudflare Worker 拉不到实时数据 —— 实测 colo=NRT 时无论带不带 pa 签名都是 403。
# 所以由 GitHub Actions（配国内出口代理 SCRAPE_PROXY）定时抓，再 POST 回站点的 /api/ingest。
#
# 频率：15 分钟一轮。全员 500 人抓一遍约 8 分钟，5 分钟会叠；15 分钟比较稳。
# 仓库是 public ⇒ Actions 分钟数免费。
name: 实时同步

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_uids:
        description: '只抓这几个 uid（逗号分隔，留空=全员）'
        default: ''

permissions:
  contents: read

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并上报
        run: node sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          FORCE_UIDS: ${{ inputs.force_uids }}
          MAX_MEMBERS: '600'

  # 红蓝活动 · 礼物计分（弦月回响）
  # 为什么塞在本工作流里而不是自己开一个：GitHub 的 schedule 触发器在这个仓库上不激活
  # （实测 4 小时 0 次），靠的是站点 Worker 的 cron 去 workflow_dispatch 这个文件。
  # 单独开一个 gift.yml 就只有 workflow_dispatch 能被拨到，一旦没人记得手动点就永远不跑。
  # 放成独立 job（不是 sync 的一步）是为了并行：两个 job 各自一个 runner，
  # 礼物扫描失败/变慢都不会拖累或打断直播与发言同步。
  gift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 扫房间礼物并上报
        run: node gift-sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          GIFT_NAME: '弦月回响'
          MAX_MEMBERS: '600'
          CONC: '6'
          GIFT_PAGES: '3'

  # 红蓝活动 · 直播间礼物
  # 直播间送礼**不进房间 IM**，只在每场直播结束后的弹幕 LRC 里（getLiveOne → msgFilePath）。
  # 所以这个 job 天然滞后到「这场播完」，不像房间侧那样准实时。
  # 独立 job：单场 LRC 可能有几万行，慢一点也不会影响另外两个 job。
  livegift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 扫直播弹幕礼物并上报
        run: node live-gift-sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          LG_MAX: '25'
