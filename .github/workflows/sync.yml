# 48 成员档案 · 实时同步（全员）
#
# 为什么要有这个仓库：口袋48 的接口按 IP 地域拦（海外出口一律 403），
# 站点自己的 Cloudflare Worker 拉不到实时数据 —— 实测 colo=NRT 时无论带不带 pa 签名都是 403。
# 所以由 GitHub Actions（配国内出口代理 SCRAPE_PROXY）定时抓，再 POST 回站点的 /api/ingest。
#
# 频率：15 分钟一轮。全员 500 人抓一遍约 8 分钟，5 分钟会叠；15 分钟比较稳。
# 仓库是 public ⇒ Actions 分钟数免费。
name: 实时同步

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_uids:
        description: '只抓这几个 uid（逗号分隔，留空=全员）'
        default: ''
      discover_pages:
        description: '成员发现往回翻几页（20 ≈ 最近 5 天；补历史可临时调到 300）'
        default: '20'

permissions:
  contents: read

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并上报
        run: node sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          FORCE_UIDS: ${{ inputs.force_uids }}
          MAX_MEMBERS: '600'

  # 成员发现（补新人 / 补房间）
  # ------------------------------------------------------------------
  # 站长 2026-10-25：「这里的成员也要补齐呀」「新成员有办法实时补吗」
  # 名册是静态快照，运营随时补人，而新人一开播就该自动上榜、房间就该被扫到。
  # 这里翻最近几天的直播历史，凡是不在名册里的主播 → server/jump 拿房间
  # → POST /api/roster/extra。worker 的 /data/members.js 是「静态 + 官方表 + 补充名册」
  # 动态拼的，所以页面和抓取端会同时看到新人，不用重新部署。
  # 🔴 每轮只翻 20 页（≈400 条，覆盖最近约 5 天），够接住刚出道的人；
  #    漏掉的由 xox48 对账那条通道（每 2 分钟）按分数兜底补进来。
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从直播历史发现新成员
        run: node discover-members.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          PAGES: ${{ inputs.discover_pages || '20' }}
          DAYS: '30'

  # 红蓝活动 · 礼物计分（弦月回响）已经拆到 gift-fast.yml：
  # 房间礼物要「实时」就得把轮询做密（2 分钟一轮），15 分钟一轮的节奏够不上。
  # 那边由站点 Worker 的 cron 直接拨，跟本工作流互不干扰。

  # 红蓝活动 · 直播间礼物
  # 直播间送礼**不进房间 IM**，只在每场直播结束后的弹幕 LRC 里（getLiveOne → msgFilePath）。
  # 所以这个 job 天然滞后到「这场播完」，不像房间侧那样准实时。
  # 独立 job：单场 LRC 可能有几万行，慢一点也不会影响另外两个 job。
  #
  # 🔴 LG_RESCAN_HOURS（2026-10-31 加）：最近 6 小时开播的场次**无视已扫标记全部重扫**。
  #    回放 LRC 是完整弹幕（实测一场 987 行 / 232 分钟 / 51 条礼物），而实时链路
  #    （live-sse-sync）掉线时那段礼物只在 LRC 里；快扫 backfill-live-gift.mjs 又会
  #    「SSE 从头覆盖就跳过」，两边一凑 ⇒ SSE 中间断线就等于永久丢分。
  #    重扫幂等（t = ctime + 弹幕偏移，worker 侧精确 + 模糊双去重），实测 added=0 不虚增。
  livegift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 扫直播弹幕礼物并上报
        run: node live-gift-sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          LG_MAX: '45'
          LG_RESCAN_HOURS: '6'
          LG_CONC: '3'
