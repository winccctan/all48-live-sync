# 录播（历史回放）全量回填 —— 手动触发
#
# 平时由「实时同步」每轮分片带一点（关注的人每轮必抓 + 全员分片轮转），
# 新功能刚上线、或想让每个人都立刻有回放时，手动跑一次这个。
# 全员 500 人 ×（1 次列表 + 4 次取播放地址）约 10 分钟。
name: 录播回填

on:
  workflow_dispatch:
    inputs:
      only_followed:
        description: '填 1 = 只回填关注的人（快）'
        default: ''
      probe:
        description: '填 1 = 只探测「老回放能不能取到地址」，不写库'
        default: ''
      uids:
        description: '只处理这几个人（逗号分隔），探测/回填都支持'
        default: ''
      play_all:
        description: '填 1 = 每条录播都取播放地址（慢，但全部可点播）'
        default: ''

permissions:
  contents: read

concurrency:
  group: vod-backfill
  cancel-in-progress: false

jobs:
  vod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 探测（老回放能不能取到地址）
        if: inputs.probe == '1'
        run: node probe-vod-play.mjs
        env:
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          UIDS: ${{ inputs.uids }}

      - name: 回填录播
        if: inputs.probe != '1'
        run: node backfill-vod.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          ONLY_FOLLOWED: ${{ inputs.only_followed }}
          ONLY_UIDS: ${{ inputs.uids }}
          # play_all=1 ⇒ 每条都取地址（全量可点播）；否则只取前 VOD_PLAY 条
          VOD_PLAY: ${{ inputs.play_all == '1' && '999' || '15' }}
