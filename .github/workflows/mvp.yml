# 2026 星梦剧院·年度之星 MVP 榜 —— 抓取与上报
#
# 数据源是口袋48 官方接口（MVP 活动页 mvp.ckg48.com 自己用的那两个）：
#   POST /scan/api/scan/v2/get/condition  → 18 队 / 255 人
#   POST /scan/api/scan/v1/query/mvp      → 逐人明细（必须逐人查，只传 teamId 会 500）
#
# 频率：每周三北京时间 12:01（UTC 04:01），**只由 Worker 的 Cron Trigger 触发**。
#   🔴 2026-10-28 事故：这里原来还留了一条 `schedule: 1 4 * * 3` 作「二层保障」，
#      结果 GitHub 自己的调度当天 18:24（北京，迟到 6.5 小时）又跑了一次，
#      POST /api/mvp/put 把「上一次基准」挤成当天那期，全站增量瞬间全变 0。
#      ⇒ 已删除 schedule，只保留 workflow_dispatch（Worker cron / 兜底 / 人工急救都走它）。
#      服务端另有硬闸：只接受「北京周三 11:50–13:10」的写入，其余一律 409。
name: MVP 榜

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并上报
        run: node mvp-sync.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          YEAR: '2026'
          MVP_CONCURRENCY: '8'
